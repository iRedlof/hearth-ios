name: Hearth
options:
  bundleIdPrefix: com.rohit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HearthKit:
    path: HearthKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - Hearth
      - path: Shared
    dependencies:
      - package: HearthKit
      - target: HearthWidgets
    entitlements:
      path: Hearth/Hearth.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rohit.hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohit.hearth
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"

  HearthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HearthWidgets
      - path: Shared
    dependencies:
      - package: HearthKit
    info:
      path: HearthWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HearthWidgets/HearthWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rohit.hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohit.hearth.widgets
        SKIP_INSTALL: "YES"
