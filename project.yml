name: Hearth
options:
  bundleIdPrefix: com.rohit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HearthKit:
    path: HearthKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Automatic signing with the real team so an App Store archive embeds the
    # target entitlements (App Group group.com.rohit.hearth). An ad-hoc "-"
    # identity made the widget extension fall back to Ad Hoc signing (rejected
    # by the iOS 27 SDK at archive) and, before that, shipped builds with no
    # App Group. CI archive passes -allowProvisioningUpdates + the ASC key so
    # Xcode generates the distribution profiles. Local sim builds still pass
    # CODE_SIGNING_ALLOWED=NO and skip signing entirely.
    DEVELOPMENT_TEAM: "5D7M37QQLU"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - Hearth
      - path: Shared
    dependencies:
      - package: HearthKit
      - target: HearthWidgets
    info:
      path: Hearth/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.rohit.hearth
            CFBundleURLSchemes:
              - hearth
        # ChargePoint auto-run asks iOS for a background wake at its next action time.
        BGTaskSchedulerPermittedIdentifiers:
          - com.rohit.hearth.chargepoint.refresh
        UIBackgroundModes:
          - fetch
    entitlements:
      path: Hearth/Hearth.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rohit.hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohit.hearth
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Confirm it's you before disarming the alarm or unlocking the door."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Hearth reads your event times and places on this phone to suggest when to leave and when a trip is coming. Nothing leaves the device."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Hearth reads your event times and places on this phone to suggest when to leave and when a trip is coming. Nothing leaves the device."

  HearthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HearthWidgets
      - path: Shared
    dependencies:
      - package: HearthKit
    info:
      path: HearthWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HearthWidgets/HearthWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rohit.hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohit.hearth.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"

  # DEBUG-only render harness (docs/RENDER-HARNESS.md): the UI walker that launches the app with
  # -demoHouse, drives the real UI and writes PNGs. Not a dependency of the app and not in the
  # Hearth scheme, so it is never built by an archive and never shipped.
  HearthRenderTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HearthRenderTests
    dependencies:
      - target: Hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohit.hearth.rendertests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Hearth

# Declaring any scheme stops Xcode auto-creating one per target, so the app's own scheme is
# declared too. The release workflows archive `Hearth`; it builds the app (and, through its
# dependencies, the widget extension and HearthKit) and nothing from the render harness.
schemes:
  Hearth:
    build:
      targets:
        Hearth: all
    run:
      config: Debug
    archive:
      config: Release
  HearthRender:
    build:
      targets:
        Hearth: all
        HearthRenderTests: [test]
    test:
      config: Debug
      targets:
        - HearthRenderTests
      gatherCoverageData: false
    run:
      config: Debug
