name: iOS release — TestFlight

# Signed iOS release, entirely in GitHub Actions on the self-hosted xcode-27
# runner (local stays verify-only) — modelled on Auris/Glimpse. Structured as
# small, single-purpose steps across two jobs so any failure names itself:
# archive, export, and upload are SEPARATE steps.
#
# Required secrets (org- or repo-level), iOS-only — never the shared macOS cert:
#   IOS_DIST_CERT_P12 / IOS_DIST_CERT_PASSWORD   Apple Distribution .p12 (base64) + password
#   IOS_TEAM_ID                                   Apple team id (5D7M37QQLU)
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_P8   App Store Connect API key (+ .p8 base64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests & project generation
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27 missing at $DEVELOPER_DIR"; exit 1; }
          xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generated project matches tracked config
        run: git diff --exit-code

      - name: HearthKit unit tests (macOS)
        run: cd HearthKit && swift test

  release:
    name: Sign, archive & upload to TestFlight
    needs: [test]
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Apple Distribution signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          umask 077
          [ -n "$IOS_DIST_CERT_P12" ] || { echo "::error::IOS_DIST_CERT_P12 missing."; exit 1; }
          [ -n "$IOS_TEAM_ID" ] || { echo "::error::IOS_TEAM_ID missing."; exit 1; }
          CERT="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/hearth-ios-signing.keychain-db"
          KPWD="$(openssl rand -hex 16)"
          security list-keychains -d user | tr -d '"' | tr '\n' ' ' > "$RUNNER_TEMP/orig-keychains.txt"
          # Apple CA chain for a complete trust path.
          curl -sfL "https://www.apple.com/appleca/AppleIncRootCertificate.cer" -o "$RUNNER_TEMP/AppleRoot.cer"
          curl -sfL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode -o "$CERT"
          security create-keychain -p "$KPWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/AppleRoot.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$CERT" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/orig-keychains.txt")
          IDENTS=$(security find-identity -v -p codesigning "$KEYCHAIN" || true)
          echo "$IDENTS" | sed -E 's/[0-9A-F]{40}/<sha>/'
          echo "$IDENTS" | grep -q "Apple Distribution: .*(${IOS_TEAM_ID})" || {
            echo "::error::No 'Apple Distribution: … (${IOS_TEAM_ID})' identity in the supplied .p12."; exit 1; }
          printf 'SIGNING_KEYCHAIN=%s\n' "$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$CERT" "$RUNNER_TEMP/AppleRoot.cer" "$RUNNER_TEMP/AppleWWDRCAG3.cer"

      - name: Place App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          umask 077
          [ -n "$ASC_API_KEY_P8" ] || { echo "::error::ASC_API_KEY_P8 missing."; exit 1; }
          KEYDIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYDIR"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode -o "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          printf 'ASC_KEY_DIR=%s\n' "$KEYDIR" >> "$GITHUB_ENV"

      - name: Archive (Release, generic iOS device — signed)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Archive WITH automatic signing so the target entitlements —
          # crucially the App Group group.com.rohit.hearth — are embedded in
          # the archive. Archiving unsigned (CODE_SIGNING_ALLOWED=NO) skips
          # entitlement embedding; the export re-sign then cannot recover the
          # App Group, so shipped builds had no shared container and failed at
          # runtime with "shared storage is unavailable". Signing at archive
          # writes archived-expanded-entitlements.xcent, which export preserves.
          xcodebuild -project Hearth.xcodeproj -scheme Hearth -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hearth.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ARCHS=arm64 CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            archive
          test -d "$RUNNER_TEMP/Hearth.xcarchive" || { echo "::error::archive not produced"; exit 1; }
          # Prove the archived app actually carries the App Group entitlement
          # (fail fast here rather than shipping a broken binary).
          ARCH_APP="$RUNNER_TEMP/Hearth.xcarchive/Products/Applications/Hearth.app"
          codesign -d --entitlements :- "$ARCH_APP" 2>/dev/null | grep -q "group.com.rohit.hearth" \
            || { echo "::error::archived app is MISSING the group.com.rohit.hearth App Group entitlement"; exit 1; }
          echo "✓ archived app carries the App Group entitlement"

      - name: Export signed IPA (App Store)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string ${IOS_TEAM_ID}" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hearth.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa produced by export"; ls -R "$RUNNER_TEMP/export" || true; exit 1; }
          printf 'IPA_PATH=%s\n' "$IPA" >> "$GITHUB_ENV"
          echo "Exported: $IPA"

      - name: Verify App Group entitlement in exported IPA
        run: |
          set -o pipefail
          WORK="$RUNNER_TEMP/verify"; rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          echo "Entitlements of $(basename "$APP"):"
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$WORK/ent.txt" | grep -A2 -i "application-groups" || true
          grep -q "group.com.rohit.hearth" "$WORK/ent.txt" \
            || { echo "::error::Exported IPA is MISSING the group.com.rohit.hearth App Group entitlement — would break shared storage on device."; exit 1; }
          echo "✓ App Group entitlement present in the shipped IPA"
          # The widget extension reads the same shared container. If its copy of the
          # entitlement is missing, every widget fails while the app looks fine.
          APPEX="$APP/PlugIns/HearthWidgets.appex"
          test -d "$APPEX" || { echo "::error::HearthWidgets.appex is missing from the exported IPA."; exit 1; }
          codesign -d --entitlements :- "$APPEX" 2>/dev/null > "$WORK/appex-ent.txt" || true
          grep -q "group.com.rohit.hearth" "$WORK/appex-ent.txt" \
            || { echo "::error::HearthWidgets.appex is MISSING the group.com.rohit.hearth App Group entitlement — widgets could not read shared storage."; exit 1; }
          echo "✓ App Group entitlement present in HearthWidgets.appex"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # altool searches a fixed set of dirs for AuthKey_<id>.p8.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${GITHUB_RUN_NUMBER} to TestFlight."

      - name: Clean up signing material
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/orig-keychains.txt" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/orig-keychains.txt") || true
          fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/export" \
                 "$RUNNER_TEMP/Hearth.xcarchive" "$RUNNER_TEMP/dd" "$RUNNER_TEMP/ExportOptions.plist" \
                 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID:-unknown}.p8" 2>/dev/null || true
